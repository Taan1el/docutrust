services:
  docutrust:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docutrust-engine
    ports:
      # The API has no authentication, so it is only published on this machine.
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - docutrust-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  docutrust-data:
